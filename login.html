<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guru — Dasar Fotografi</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2C3E50 0%, #34495e 60%, #E67E22 140%);
            padding: 2rem 1rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-wrapper {
            background: white;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .login-icon-wrap {
            text-align: center;
            margin-bottom: 1rem;
        }

        .login-icon-wrap .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #E67E22, #d35400);
            color: white;
            border-radius: 20px;
            font-size: 2.5rem;
            box-shadow: 0 8px 24px rgba(230, 126, 34, 0.35);
        }

        .login-wrapper h1 {
            text-align: center;
            margin: 0 0 0.5rem 0;
            color: #2C3E50;
            font-size: 1.75rem;
        }

        .login-wrapper .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            margin: 0 0 2rem 0;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #2C3E50;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #E67E22;
            box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.15);
        }

        .login-error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin: 0.75rem 0;
            min-height: 1.2rem;
            text-align: center;
            padding: 0.5rem;
            border-radius: 8px;
            background: #ffebee;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        .login-btn {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #E67E22, #d35400);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(230, 126, 34, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .login-footer a {
            color: #E67E22;
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-icon-wrap">
            <div class="icon">🔐</div>
        </div>
        
        <h1>Login Guru</h1>
        <p class="subtitle">
            Dashboard Guru — Media Pembelajaran<br>
            <strong>Dasar Fotografi · SMKN 1 Purwodadi</strong>
        </p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="guru@sekolah.sch.id" 
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password guru" 
                       autocomplete="current-password" required>
            </div>

            <div class="login-error" id="login-error"></div>

            <button type="submit" class="login-btn" id="login-btn">
                <span id="btn-text">🚀 Masuk Dashboard</span>
            </button>
        </form>

        <p class="login-footer">
            <a href="index.html">← Kembali ke Media Pembelajaran</a>
        </p>
    </div>

    <script type="module">
        import { supabase } from './js/supabase-client.js';

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorEl = document.getElementById('login-error');
        const btn = document.getElementById('login-btn');
        const btnText = document.getElementById('btn-text');

        // Cek kalau sudah login → langsung redirect ke dashboard
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            window.location.href = 'dashboard.html';
        }

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.classList.add('show');
        }

        function hideError() {
            errorEl.classList.remove('show');
        }

        function setLoading(loading) {
            btn.disabled = loading;
            if (loading) {
                btnText.innerHTML = '<span class="spinner"></span> Memproses...';
            } else {
                btnText.textContent = '🚀 Masuk Dashboard';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Email dan password wajib diisi.');
                return;
            }

            setLoading(true);

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    // Pesan error lebih ramah
                    if (error.message.includes('Invalid login')) {
                        showError('❌ Email atau password salah.');
                    } else if (error.message.includes('Email not confirmed')) {
                        showError('📧 Email belum dikonfirmasi. Hubungi admin.');
                    } else {
                        showError('❌ ' + error.message);
                    }
                    setLoading(false);
                    return;
                }

                // ✅ Login berhasil
                console.log('Login sukses:', data.user?.email);
                window.location.href = 'dashboard.html';

            } catch (err) {
                console.error(err);
                showError('❌ Terjadi kesalahan. Coba lagi.');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
